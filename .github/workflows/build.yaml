name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and generate reports
        run: mvn -B -ntp -f demo/pom.xml clean verify site

      - name: Upload reports        
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            demo/target/site/jacoco
            demo/target/reports/apidocs
          if-no-files-found: error
